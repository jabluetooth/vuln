name       = "vuln-patcher-relay"
main       = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace — run: wrangler kv:namespace create SCAN_RESULTS
# then paste the returned id below
[[kv_namespaces]]
binding = "SCAN_RESULTS"
id      = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Secrets (set with wrangler secret put <NAME>):
#   WEBHOOK_SECRET    — random 32-char string, also set in GitHub webhook
#   GITHUB_PAT        — read-only PAT for downloading artifacts
#   EXTENSION_TOKEN   — random token the extension sends in Authorization header
