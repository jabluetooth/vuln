name: Vulnerability Auto-Patcher

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9AM UTC
  workflow_dispatch:
    inputs:
      # ── Target repo (set by Chrome extension when scanning another repo) ──────
      target_repo:
        description: 'Repo to scan (owner/repo). Leave blank to scan this repo.'
        required: false
        default: ''
        type: string

      # ── Scan settings (all overridable from the Chrome extension) ─────────────
      min_severity:
        description: 'Minimum severity (LOW/MODERATE/HIGH/CRITICAL)'
        required: false
        default: 'MODERATE'
        type: choice
        options: ['LOW', 'MODERATE', 'HIGH', 'CRITICAL']
      cvss_threshold:
        description: 'Minimum CVSS score (0 = disabled)'
        required: false
        default: '0'
        type: string
      package_denylist:
        description: 'Comma-separated package names to skip'
        required: false
        default: ''
        type: string
      cve_denylist:
        description: 'Comma-separated CVE/GHSA IDs to skip'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — log only, open no PRs'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  scan-and-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write

    steps:
      - name: Checkout central scanner
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Resolve scan target ──────────────────────────────────────────────────
      # When target_repo is set (and differs from this repo), clone it.
      # SCAN_ROOT and REPO_NAME are written to $GITHUB_ENV so subsequent steps
      # pick them up automatically.
      - name: Resolve scan target
        env:
          SCANNER_PAT: ${{ secrets.SCANNER_PAT }}
          # Pass user-controlled inputs via env vars — never interpolate directly
          # into shell scripts (GitHub Actions expression injection risk).
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}
          SELF_REPO: ${{ github.repository }}
        run: |
          TARGET="$INPUT_TARGET_REPO"
          SELF="$SELF_REPO"

          # Validate: only allow owner/repo format (alphanum, hyphens, dots, slashes)
          if [ -n "$TARGET" ] && ! echo "$TARGET" | grep -qE '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid target_repo format: '$TARGET'. Must be owner/repo."
            exit 1
          fi

          if [ -n "$TARGET" ] && [ "$TARGET" != "$SELF" ]; then
            echo "Scanning remote repo: $TARGET"

            if [ -z "$SCANNER_PAT" ]; then
              echo "::error::SCANNER_PAT secret is required to scan a remote repository."
              echo "Add a classic PAT with 'repo' and 'workflow' scopes as the SCANNER_PAT secret."
              exit 1
            fi

            git clone \
              "https://x-access-token:${SCANNER_PAT}@github.com/${TARGET}.git" \
              /tmp/target-repo

            echo "SCAN_ROOT=/tmp/target-repo" >> $GITHUB_ENV
            echo "REPO_NAME=${TARGET}"        >> $GITHUB_ENV
            echo "USE_SCANNER_PAT=true"       >> $GITHUB_ENV
          else
            echo "Scanning self: $SELF"
            echo "SCAN_ROOT=."                >> $GITHUB_ENV
            echo "REPO_NAME=${SELF}"          >> $GITHUB_ENV
            echo "USE_SCANNER_PAT=false"      >> $GITHUB_ENV
          fi

      - name: Run vulnerability scanner
        env:
          # Token: use SCANNER_PAT for cross-repo PRs, GITHUB_TOKEN for self
          GITHUB_TOKEN: ${{ env.USE_SCANNER_PAT == 'true' && secrets.SCANNER_PAT || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # REPO_NAME and SCAN_ROOT are set dynamically by the previous step

          # ── Filtering ──────────────────────────────────────────────────────
          MIN_SEVERITY:     ${{ github.event.inputs.min_severity     || 'MODERATE' }}
          CVSS_THRESHOLD:   ${{ github.event.inputs.cvss_threshold   || '0' }}
          PACKAGE_DENYLIST: ${{ github.event.inputs.package_denylist || '' }}
          CVE_DENYLIST:     ${{ github.event.inputs.cve_denylist     || '' }}
          DRY_RUN:          ${{ github.event.inputs.dry_run          || 'false' }}

          MAX_PRS_PER_RUN: '10'
          SKIP_DEPENDABOT: 'false'

          # ── PR options ──────────────────────────────────────────────────────
          PR_LABELS: security,dependencies
          PR_REVIEWERS: ''
          AUTO_MERGE_PATCH: 'false'

          # ── GitHub Enterprise ───────────────────────────────────────────────
          # GITHUB_API_URL: https://github.mycompany.com/api/v3

          # ── Notifications ───────────────────────────────────────────────────
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL:         ${{ secrets.ALERT_EMAIL }}
        run: python scanner/main.py

      # ── Upload artifacts ─────────────────────────────────────────────────────
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_id }}
          path: |
            scan_report.json
            sbom.json
            scan_history.json
          if-no-files-found: ignore
          retention-days: 90

      # ── Commit dashboard back to the central scanner repo ────────────────────
      - name: Commit dashboard and history
        if: always()
        run: |
          git config user.email "vuln-patcher-bot@noreply.github.com"
          git config user.name "Vuln Auto-Patcher Bot"
          git add docs/index.html scan_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update vulnerability dashboard [skip ci]"
          git push origin HEAD:${{ github.ref_name }} 2>/dev/null || true
